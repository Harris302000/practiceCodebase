<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
</head>

<body>
    <center>
        <form>
            <h1>Student Registration Form</h1>
            <table>
                <tr>
                    <td>

                        <label>Name:</label>
                    </td>
                    <td>
                        <input type="text" placeholder="Enter Your name">
                    </td>
                </tr>
                <tr>
                    <td>

                        <label>Age:</label>
                    </td>
                    <td>
                        <input type="number" placeholder="Enter Your Age">
                    </td>
                </tr>
                <tr>
                    <td>
                        Address:
                    </td>
                    <td>
                        <input type="text" placeholder="Enter Your Address">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Gender:</label>
                    </td>
                    <td>
                        <input type="radio" name="gender"> <label for="gender">Male</label>
                        <input type="radio" name="gender"> <label for="gender">Female</label>
                        <input type="radio" name="gender"> <label for="gender">Transgender</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Department:</label>

                    </td>
                    <td>
                        <select>
                            <option value="">Select</option>
                            <option value="EEE">Electrical And Electronics Engineering</option>
                            <option value="ECE">Electrical And Communication Engineering</option>
                            <option value="IT">Information Technology</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Coding Skils</label>
                    </td>
                    <td>
                        <input type="checkbox" value="HTML"> <label>HTML</label>
                        <input type="checkbox" value="CSS"> <label>CSS</label>
                        <input type="checkbox" value="JS"> <label>Java Script</label>
                    </td>
                </tr>
                <tr>
                    <td>
                    </td>
                    <td>
                        <input type="submit" value="Save Data">
                    </td>
                </tr>
                
            </table>
        </form>



    </center>







    <center>
        <br>
        <br>
        <br>
        <form>

            Name: <input type="text"> <br>
            Age: <input type="number"> <br>
            <input type="submit">
            <input type="reset">

        </form>

    </center>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Team</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Messi</td>
                    <td>48</td>
                    <td>Argentna</td>
                </tr>
                <tr>
                    <td>Neymar</td>
                    <td>46</td>
                    <td>Brazil</td>
                </tr>
                <tr>
                    <td>Ronaldo</td>
                    <td>39</td>
                    <td>Portugal</td>
                </tr>

            </tbody>

        </table>

    </center>
</body>

</html>
