<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Jersey Store - Login</title>
    <link rel="stylesheet" href="/CSS/login.css">
</head>

<body>

    <div id="Header-div">
        <label for="Home-Button">The Jersey Store</label>

        <div id="header-button-div">
            <button id="Home-Button" onclick="window.location.href='/HTML/Welcome.html' ">Home</button>
            <button id="Signin-Button" onclick="window.location.href='/HTML/SignIn.html' ">signin</button>
        </div>

    </div>


    <div id="main-div">
        <div class="card">
            <h1>Login</h1>
            <div>

                <table spellcheck="true">
                    <tr>
                        <td>
                            <label id="Username_label" for="Username">Username:</label>
                        </td>
                        <td>
                            <input type="text" name="Username" id="Username">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label id="Password_label" for="Password">Password:</label>
                        </td>
                        <td>
                            <input type="password" name="Password" id="Password">
                        </td>
                    </tr>
                </table>
            </div>

            <button id="login-button">Login</button>

            <div>

                <img src="/Images/loader1.gif" style="height: 100px; margin-top: 20px;">

            </div>
        </div>

    </div>

    <footer>© 2026 The Jersey Store</footer>


</body>

</html>
