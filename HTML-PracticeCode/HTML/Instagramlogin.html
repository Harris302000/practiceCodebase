<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="/CSS/insta-properties.css">
</head>
<body>
    <div class="main-div">
        <div class="left-div">
            <div style="width: 100%; display: flex; justify-content: left; ">
                    <img src="/Images/IG-Logo.webp" style="  width: 150px; height: 150px; align-items: center; justify-content: center;margin-bottom: -100px;" alt="">
                </div>
            <div class="left-div-components">
                <p>See everyday moments from your close friends.</p>
                <div style="width: 100%; display: flex; justify-content: center ;">
                    <img src="/Images/IG-Image1.webp" style="  width: 330px; height: 270px; align-items: center; justify-content: center;" alt="">
                </div>
            </div> 
        </div>
        <div class="center-div">
            <hr>
        </div>
        <div class="right-div">
        
            <div class="right-components-div">
                <h3>Log in to Instagram</h3>
                <div class="right-components-div1">
                    <input type="text" name="userid" placeholder="Mobile number,username or email">
                    <input type="password" name="password" placeholder="Password">        
                    <button id="loginBtn">Log in</button>
                    <button id="forgetPassBtn">Forgetten Password?</button>
                </div>

                <div class="right-components-div2">
                    <button id="linkWithFbBtn">Connect With Facebook</button>
                    <button id="newAccBtn">Create New Account</button>
                    <label for="">♾️Meta</label>
                    
                </div>
                
            </div>
        
        </div>
    </div>
</body>
</html>
